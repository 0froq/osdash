minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
shellEmulator: true

packages:
  - .
  - docs

overrides:
  # cssnano 9 dropped the staged-publish evidence required by trustPolicy.
  '@nuxt/vite-builder@4.6.1>cssnano': 8.0.10
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

catalog:
  '@froq/og-covers-layer': github:0froq/og-layer#v0.2.1

catalogs:
  dev:
    '@types/node': 26.6.2
    cf: 1.0.0-beta.12
    jiti: ^2.7.0
    lint-staged: ^16.1.6
    nuxtseo-devtools-host: ^1
    simple-git-hooks: ^2.14.0
    typescript: ~5.9.3
    vite-plus: 1.3.0
    vue-tsc: ^3.3.11
    '@x18n/cli': ^0.1.4
    '@x18n/core': ^0.1.4
    '@x18n/devtools': ^0.1.4
    wrangler: ^4.136.0
  prod:
    '@fontsource-variable/geist': ^5.3.0
    '@fontsource-variable/geist-mono': ^5.3.0
    '@fontsource/instrument-serif': ^5.3.0
    '@nuxt/content': ^3.16.1
    '@nuxtjs/i18n': ^10.6.0
    nuxt: ^4.6.1
    vue: ^3.5.43
minimumReleaseAgeExclude:
  - '@x18n/builtins@0.1.4'
  - '@x18n/cli@0.1.4'
  - '@x18n/core@0.1.4'
  - '@x18n/devtools@0.1.4'
  - '@x18n/node@0.1.4'
  - '@x18n/ui@0.1.4'
